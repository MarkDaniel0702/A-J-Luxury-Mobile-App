<!doctype html>
<html lang="en-PH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4eee3">
<title>A&amp;J Luxury · Prototype 4 · Bloom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../shared/phone.css">
<style>
/* Prototype 4 "Bloom": bright and rounded. Cream, forest green, terracotta and butter. Bold grotesque headings, bento tiles, floating pill dock with a centre "+".
   Own features: Buy/Consign switch on Home, swipe-to-Discover cards, Layaway planner, one-question-at-a-time Consign flow, Consignment tracker,
   Notifications, SMS-style code check at sign-up, guided assistant "Ava".
   No A&J website images, logo or text assets. Pictures are generated placeholders (shared/core.js). */
:root{--bg:#f4eee3;--card:#fffaf1;--ink:#14201c;--mute:#667069;--forest:#12372c;--forest2:#1f5242;--terra:#d9553b;--butter:#f4d777;--sage:#bcd5c4;--blush:#f6c9b8;--line:#e6dccb;--err:#c0392b;--sw:2;--r:24px;
 --disp:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;--ui:"Instrument Sans","Segoe UI",system-ui,sans-serif;
 --stage:#e3dac8;--sbc:#12372c;--hbc:#12372c;--capc:#7b705c;--capb:#12372c}
.screen.lt{--sbc:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font:400 15px/1.5 var(--ui);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.4px;line-height:1.05}

#app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--sat);background:var(--bg);overflow:hidden}
#app.full{padding-top:0}
main{flex:1;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:104px}
main.nodock{padding-bottom:24px}
main::-webkit-scrollbar{display:none}
main:focus-visible{outline:0}
main>*{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
main.still>*{animation:none}
main>:nth-child(2){animation-delay:.05s}main>:nth-child(3){animation-delay:.1s}main>:nth-child(4){animation-delay:.15s}main>:nth-child(n+5){animation-delay:.2s}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* bars */
.tb{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:6px 10px 4px}
.tb .tt{text-align:center;font:700 17px var(--disp);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px #12372c1a}
.rb:active{transform:scale(.94)}
.dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--terra);color:#fff;font:700 10px/18px var(--ui);text-align:center}
#gb{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 18px 0;padding:4px 14px;border-radius:14px;background:var(--butter);font-size:12px;font-weight:500}
#gb button{background:none;border:0;font-weight:700;text-decoration:underline;cursor:pointer;min-height:30px}
.dock{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 8px);z-index:20;height:66px;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;background:var(--forest);border-radius:34px;box-shadow:0 14px 34px #12372c66}
.dock a{display:flex;flex-direction:column;align-items:center;gap:1px;font:600 10px var(--ui);letter-spacing:.3px;color:#bcd5c4;padding-top:4px}
.dock a[aria-current]{color:var(--butter)}
.dock a[aria-current] .i{stroke-width:2.4}
.plus{width:60px;height:60px;border-radius:50%;margin:-30px auto 0;border:5px solid var(--bg);background:var(--butter);color:var(--forest);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px #12372c55;transition:transform .2s}
.plus:active{transform:scale(.92) rotate(45deg)}
.cta{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 8px);z-index:20;display:flex;gap:10px;align-items:center;padding:10px;background:var(--forest);border-radius:34px;box-shadow:0 14px 34px #12372c66}
.cta .btn{flex:1}
.cta .rb{flex:none;background:#ffffff1c;color:var(--butter);box-shadow:none}
.cta .rb.on{color:var(--butter)}.cta .rb.on .i{fill:currentColor}

/* buttons + forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border:2px solid var(--forest);border-radius:999px;background:var(--forest);color:#fff8e8;font:700 15px var(--disp);letter-spacing:.1px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.o{background:transparent;color:var(--forest)}
.btn.y{background:var(--butter);border-color:var(--butter);color:var(--forest)}
.btn.t{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.blk{display:flex;width:100%}
.btn.sm{min-height:40px;padding:0 18px;font-size:14px}
.btn[disabled]{opacity:.45}
.lnk{background:none;border:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.fld{display:block;margin-bottom:14px;position:relative}
.fld>span{display:block;font:600 13px var(--ui);color:var(--mute);margin:0 0 5px 4px}
input[type=email],input[type=password],input[type=search],input[type=text],input[type=tel],select,textarea{width:100%;min-height:52px;padding:12px 18px;border:2px solid transparent;border-radius:18px;background:#fff;font-size:16px;box-shadow:0 1px 0 var(--line)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--forest)}
textarea{min-height:84px;resize:none}
[aria-invalid=true]{border-color:var(--err)!important}
.err{display:block;margin:4px 0 0 6px;font-size:12px;font-weight:500;color:var(--err)}
.err:empty{display:none}
.eye{position:absolute;right:6px;bottom:4px;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--mute);cursor:pointer}
.chk{display:flex;gap:12px;align-items:flex-start;padding:8px 4px;font-size:14px}
.chk input{appearance:none;flex:none;width:24px;height:24px;margin-top:0;border:2px solid var(--forest);border-radius:8px;background:#fff;cursor:pointer;display:grid;place-items:center}
.chk input:checked{background:var(--forest)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid var(--butter);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 18px;border:2px solid var(--forest);border-radius:999px;background:transparent;font:600 14px var(--ui);cursor:pointer;white-space:nowrap;color:var(--forest)}
.chip[aria-pressed=true],.chip[aria-current]{background:var(--forest);color:var(--butter)}
.chip.sm{min-height:36px;padding:0 14px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.scroll{display:flex;gap:8px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex:none}
.lab{display:block;font:600 13px var(--ui);color:var(--mute);margin:4px 0 0 4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:#e9dfcd;margin:8px 18px 4px}
.seg button{min-height:42px;border:0;border-radius:999px;background:transparent;font:700 15px var(--disp);color:var(--forest);cursor:pointer;transition:background .2s}
.seg button[aria-pressed=true]{background:var(--forest);color:var(--butter)}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{appearance:none;width:52px;height:30px;border-radius:15px;background:#d8cdb8;cursor:pointer;transition:background .2s}
.sw input:checked{background:var(--forest)}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;pointer-events:none}
.sw:has(input:checked)::after{transform:translateX(22px);background:var(--butter)}

/* login + auth */
.lg{min-height:100%;display:flex;flex-direction:column;background:var(--forest)}
.lgt{position:relative;height:262px;padding:calc(var(--sat) + 22px) 26px 0;color:#fff8e8;overflow:hidden}
.blob{position:absolute;border-radius:50%}
.b1{width:260px;height:260px;right:-90px;top:-70px;background:var(--forest2)}
.b2{width:150px;height:150px;left:-50px;bottom:-30px;background:var(--terra);opacity:.9}
.lgt .wm{position:relative;font:800 60px/1 var(--disp);letter-spacing:-2px}
.lgt p{position:relative;max-width:190px;margin-top:6px;color:#d6e6dc;font-size:14px}
.fan{position:absolute;right:16px;bottom:-24px;width:170px;height:150px}
.fan img{position:absolute;bottom:0;width:104px;height:104px;border-radius:20px;border:3px solid #fff8e8;object-fit:cover;box-shadow:0 8px 20px #0004;transform:rotate(var(--r))}
.fan img:nth-child(1){left:0}.fan img:nth-child(2){left:34px;bottom:12px}.fan img:nth-child(3){left:66px}
.lgb{flex:1;margin-top:-10px;padding:28px 24px 24px;background:var(--bg);border-radius:34px 34px 0 0;position:relative}
.lgb h1{font-size:30px;margin-bottom:16px}
.two{display:flex;justify-content:space-between;margin:2px 4px 0;font-size:14px;font-weight:600}
.or{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--mute);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.fine{margin-top:12px;text-align:center;font-size:12px;color:var(--mute)}
.page{padding:6px 22px 24px}
.page h1{font-size:32px;margin:8px 0 6px}
.page>p{color:var(--mute);margin-bottom:16px}
.otp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
.otp input{min-height:68px;padding:0;text-align:center;font:800 30px var(--disp);border-radius:20px}

/* home */
.hello{display:flex;align-items:center;gap:12px;padding:8px 18px 4px}
.av{width:46px;height:46px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font:800 19px var(--disp);flex:none}
.hello div{flex:1;min-width:0}
.hello small{display:block;color:var(--mute);font-size:13px;line-height:1.1}
.hello b{display:block;font:800 21px var(--disp);letter-spacing:-.3px}
.sbox{display:flex;align-items:center;gap:10px;margin:10px 18px 0;padding:0 18px;min-height:52px;border-radius:999px;background:#fff;color:var(--mute);box-shadow:0 1px 0 var(--line)}
.disc{position:relative;display:flex;align-items:center;justify-content:space-between;margin:14px 18px 0;padding:22px;min-height:168px;border-radius:30px;background:var(--forest);color:#fff8e8;overflow:hidden}
.disc small{font:600 12px var(--ui);letter-spacing:.8px;text-transform:uppercase;color:var(--butter)}
.disc h2{font-size:27px;margin:6px 0 14px}
.stk{position:relative;width:118px;height:130px;flex:none}
.stk img{position:absolute;width:92px;height:112px;border-radius:18px;border:3px solid #fff8e8;object-fit:cover}
.stk img:nth-child(1){left:0;top:14px;transform:rotate(-9deg)}.stk img:nth-child(2){left:26px;top:2px;transform:rotate(7deg)}
.cats{padding:18px 18px 4px;gap:14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px var(--ui);width:68px}
.cat img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 8px #12372c22}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 18px 0}
.bt{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:120px;padding:16px;border-radius:26px;overflow:hidden}
.bt small{font:600 12px var(--ui);opacity:.75}
.bt b{font:800 22px/1.05 var(--disp);letter-spacing:-.3px}
.bt .i{position:absolute;right:14px;top:14px;width:30px;height:30px;opacity:.9}
.bt.a{background:var(--butter)}.bt.b{background:var(--terra);color:#fff}.bt.c{background:var(--sage)}.bt.d{background:var(--blush)}
.bt.wide{grid-column:1/-1;min-height:96px;background:var(--forest);color:#fff8e8}
.bt.wide span{font-size:14px;color:#d6e6dc}
.sh{display:flex;justify-content:space-between;align-items:baseline;padding:26px 18px 10px}
.sh h2{font-size:23px}
.sh a{font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.how{display:grid;gap:10px;padding:0 18px}
.how div{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:22px;background:var(--card)}
.how .ico{width:44px;height:44px;border-radius:50%;background:var(--sage);display:grid;place-items:center;flex:none}
.how b{display:block;font:700 16px var(--disp)}
.how span{font-size:13px;color:var(--mute);line-height:1.3;display:block}
.trk{margin:14px 18px 0;padding:18px;border-radius:28px;background:var(--forest);color:#fff8e8}
.trk h2{font-size:22px}
.trk small{color:var(--butter);font:600 12px var(--ui);letter-spacing:.8px;text-transform:uppercase}
.bar{height:10px;border-radius:5px;background:#ffffff26;margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--butter);transition:width .6s}
.bar.dk{background:#e6dccb}.bar.dk i{background:var(--forest)}
.note{margin:18px;padding:12px 14px;border-radius:16px;background:#ece2cf;font-size:12px;color:var(--mute)}

/* cards, shop */
.card{position:relative;min-width:0;border-radius:22px;background:var(--card);overflow:hidden;box-shadow:0 2px 0 var(--line)}
.card img{width:100%;aspect-ratio:1;object-fit:cover}
.card .tx{padding:10px 12px 12px}
.card .b{font:600 11px var(--ui);letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
.card .t{font:600 14px/1.25 var(--ui);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.card .pr{font:800 17px var(--disp);margin-top:2px}
.card.ls{display:flex}
.card.ls img{width:112px;height:112px;flex:none}
.card.ls .tx{flex:1;align-self:center}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:#fffaf1e6;color:var(--ink);cursor:pointer}
.heart.on{color:var(--terra)}.heart.on .i{fill:currentColor}
.heart .i{width:20px;height:20px}
.badge{position:absolute;left:8px;top:8px;padding:2px 10px;border-radius:999px;background:var(--butter);font:700 11px var(--ui);letter-spacing:.5px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 18px}
.grid.one{grid-template-columns:1fr}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 18px 6px;scrollbar-width:none}
.row .card{flex:none;width:156px}
.big{padding:10px 18px 0;font-size:34px}
.tools{display:flex;gap:8px;align-items:center;padding:10px 18px 0}
.tools .sbox{flex:1;margin:0;min-height:48px;padding:0 6px 0 16px}
.tools .sbox input{flex:1;min-height:44px;padding:0;border:0;background:transparent;box-shadow:none;border-radius:0}
.cnt{padding:10px 20px 0;color:var(--mute);font-size:13px}
.empty{padding:50px 28px;text-align:center;color:var(--mute)}
.empty .i{width:44px;height:44px;margin:0 auto 12px;color:var(--forest)}
.empty .btn{margin-top:16px}
.fchip{display:inline-flex;align-items:center;gap:6px;margin:10px 18px 0;padding:6px 8px 6px 14px;border-radius:999px;background:var(--butter);font:600 13px var(--ui)}
.fchip a{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#12372c22}
input[type=range]{appearance:none;width:100%;min-height:0;height:8px;padding:0;border-radius:4px;background:#e6dccb;box-shadow:none;border:0}
input[type=range]::-webkit-slider-thumb{appearance:none;width:28px;height:28px;border-radius:50%;background:var(--forest);border:4px solid var(--butter);cursor:pointer}

/* product */
.pg{position:relative;margin:0 14px;border-radius:30px;overflow:hidden;background:#fff}
.pg .snap>*{width:100%}
.snap{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.snap::-webkit-scrollbar{display:none}
.snap>*{flex:none;scroll-snap-align:start}
.pg img{width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in}
.pg .rb{position:absolute;top:12px}
.pg .heart{top:12px;right:12px;width:44px;height:44px}
.dots{display:flex;justify-content:center;gap:6px;padding:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:#d8cdb8}
.dots i.on{width:24px;border-radius:4px;background:var(--forest)}
.pi{padding:4px 22px 0}
.pi .bb{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--sage);font:700 12px var(--ui);letter-spacing:.5px;text-transform:uppercase}
.pi h1{font-size:27px;margin:8px 0}
.pi .pp{font:800 30px var(--disp);color:var(--terra)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tags span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:14px;background:var(--card);font-size:13px;font-weight:500}
.tags .i{width:16px;height:16px}
.lay{margin:14px 18px 0;padding:18px;border-radius:26px;background:var(--sage)}
.lay h3{font-size:19px;display:flex;align-items:center;gap:8px}
.lay .big2{font:800 32px var(--disp);margin:8px 0 2px}
.lay small{display:block;color:#33503f;font-size:13px}
.lay .chips{margin:12px 0 10px}
.lay .chip{border-color:var(--forest2);min-height:38px;padding:0 14px}
.det{margin:14px 18px 0;border-radius:22px;background:var(--card);overflow:hidden}
.det details{border-top:2px solid var(--bg)}
.det details:first-child{border-top:0}
summary{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 18px;font:700 16px var(--disp);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary .i{transform:rotate(180deg)}
.dbody{padding:0 18px 16px;color:var(--mute);font-size:14px}
.dbody p+p{margin-top:8px}
.dbody a{color:var(--ink);font-weight:600;text-decoration:underline}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.kv dt{color:var(--mute)}.kv dd{text-align:right;font-weight:500}

/* discover */
.dkw{position:relative;margin:8px 18px 0;height:470px}
.dcard{position:absolute;inset:0;border-radius:32px;background:var(--card);overflow:hidden;box-shadow:0 14px 30px #12372c2e;touch-action:none;user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s;cursor:grab}
.dcard.drag{transition:none;cursor:grabbing}
.dcard img{width:100%;height:340px;object-fit:cover;pointer-events:none}
.dcard .tx{padding:16px 20px}
.dcard .b{font:600 12px var(--ui);letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
.dcard .t{font:800 20px/1.15 var(--disp);margin:2px 0 4px;letter-spacing:-.3px}
.dcard .pr{font:800 22px var(--disp);color:var(--terra)}
.dcard:not(:last-child){pointer-events:none}
.stamp{position:absolute;top:22px;padding:4px 14px;border:4px solid;border-radius:12px;font:800 24px var(--disp);letter-spacing:1px;opacity:0;transform:rotate(-10deg)}
.stamp.s{left:20px;color:#2b8a54;border-color:#2b8a54;background:#ffffffd0}
.stamp.k{right:20px;color:var(--terra);border-color:var(--terra);transform:rotate(10deg);background:#ffffffd0}
.dctl{display:flex;justify-content:center;gap:22px;margin-top:20px}
.dctl button{width:64px;height:64px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px #12372c33}
.dctl button:active{transform:scale(.92)}
.dctl .i{width:28px;height:28px;stroke-width:2.4}
.dctl .k{background:#fff;color:var(--terra)}.dctl .s{background:var(--terra);color:#fff;width:72px;height:72px;margin-top:-4px}.dctl .d{background:var(--forest);color:var(--butter)}
.dcount{display:flex;justify-content:space-between;align-items:center;padding:6px 22px 0;font-size:13px;color:var(--mute)}

/* assistant */
.ah{display:flex;align-items:center;gap:12px;padding:8px 18px 10px}
.ava{width:48px;height:48px;border-radius:50%;background:var(--butter);color:var(--forest);display:grid;place-items:center;flex:none}
.ah b{display:block;font:800 22px var(--disp)}
.ah small{display:flex;align-items:center;gap:6px;color:var(--mute)}

.lh{padding:20px 22px 0;font:700 13px var(--ui);letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
.act{display:block;margin:10px 18px 0;padding:16px;border-radius:24px;background:var(--card)}

.pill{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--butter);font:700 11px/20px var(--ui);letter-spacing:.4px;text-transform:uppercase;color:var(--forest)}
.pill.sm{background:var(--sage)}
.tl{list-style:none;margin:6px 0 0}
.tl li{position:relative;padding:0 0 18px 38px;color:var(--mute);font-weight:500}
.tl li::before{content:"";position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:#e6dccb}

.ok{text-align:center;padding:24px 22px 4px}

.ok .big .i{width:42px;height:42px;stroke-width:2.6}
@keyframes bounce{from{transform:scale(0)}}
.ok h1{font-size:28px}.ok p{color:var(--mute);margin-top:4px}
.pad{padding:16px 18px}
.card2{margin:12px 18px 0;padding:18px;border-radius:24px;background:var(--card)}
.sched{width:100%;border-collapse:collapse;margin-top:6px}
.sched td{padding:9px 0;border-bottom:2px solid var(--bg)}

.lb .snap>*{width:100%}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="stage">
 <div class="phone">
  <div class="screen" id="screen">
   <div id="app">
    <div id="gb" hidden><span>Guest mode · view only</span><button data-act="login">Log in</button></div>
    <main id="main" tabindex="-1"></main>
    <nav class="dock" id="dock" aria-label="Primary" hidden></nav>
    <div class="cta" id="cta" hidden></div>
    <div class="sheet" id="sheet" hidden><div class="scrim" data-act="close"></div><div class="panel" id="panel" role="dialog" aria-modal="true" data-dismiss="close" data-dir="down"></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
   </div>
  </div>
 </div>
 <div class="cap"><b>Prototype 4 · Bloom</b>Log in with any email or mobile number and password, or continue as guest. Sign-up code: any 4 digits. Nothing is sent or saved. Drag with the mouse to swipe.</div>
</div>

<script src="../shared/core.js"></script>
<script>
const {$, $$, esc, peso, ic, S, ITEMS, CATS, BRANDS, isGuest, toast, pic, item, catName, D, req, ticked, mobileRule, emailRule, validate, fld, sel, chk} = AJ;
const art = (p, v, cap) => pic(p, 'pop', v, cap);
let mode = 'buy', layout = 'grid', q = '', sort = 'featured', tab = 'all', sq = '';
const F = {max: 250000, cond: 'any', brands: new Set()};
let NOTES = [], CW = {step: 0, photos: new Set()};
S.msgs.push({who: 'bot', text: 'Kumusta! I’m Ava, the A&J FAQ assistant (prototype). Pick a topic or type your question.', topic: 'hi'});
const MEMBER = 'saved activity act layaway consign settings'.split(' ');
const n = (k, one, many) => k + ' ' + (k === 1 ? one : many);
const rank = p => p.isNew ? 10 : parseFloat(p.rank);
const PRESET = {under30: ['Under ₱30,000', p => p.price < 30000], new: ['Brand new', p => p.isNew], top: ['Top condition', p => rank(p) >= 9.5]};
const GROUPS = [['buy', 'Buying', ['buy', 'condition', 'account']], ['consign', 'Consigning', ['consign', 'sell', 'payout']], ['ship', 'Shipping & payment', ['shipping', 'payment', 'layaway']],
  ['auth', 'Authenticity', ['authentic']], ['ret', 'Returns', ['returns']], ['visit', 'Visit us', ['showroom']]];
let AV = {g: null};

/* ---------- notifications + activity ---------- */
const note = (icon, title, sub, href) => NOTES.unshift({icon, title, sub, href, unread: true});
const unread = () => NOTES.filter(n => n.unread).length;
const STEPS = {Inquiry: ['Inquiry sent', 'A&J replies', 'Payment', 'Delivery or pick-up'], Layaway: ['Request sent', 'A&J confirms terms', 'Down payment (30%)', 'Monthly payments', 'Item released'], Consignment: ['Submitted', 'Received', 'Authenticated', 'Listed', 'Sold', 'Paid out']};
function addAct(type, title, sub, rows, extra = {}) {
  const r = {ref: AJ.ref({Inquiry: 'INQ', Layaway: 'LAY', Consignment: 'CON'}[type]), type, title, sub, rows, at: 0, date: AJ.fmtDate(new Date()), ...extra};
  S.req.unshift(r); return r;
}
const statusOf = r => STEPS[r.type][r.at];
function seed() { // one clearly-labelled sample so the tracker has a mid-journey example
  if (S.req.some(r => r.sample)) return;
  S.req.push({ref: 'CON-0001', type: 'Consignment', title: 'Sample · Leather Tote', sub: 'Consign · Excellent', at: 3, sample: true, date: 'Sample', cat: 'bags',
    rows: [['Request', 'Consign'], ['Condition', 'Excellent'], ['Photos', '7 of 10'], ['Hand-over', 'Dropped off']]});
  note('sparkle', 'Welcome to A&J', 'Browse pieces, or list one of your own to consign.', '#/home');
}

/* ---------- pieces ---------- */
const heartBtn = (id, cls = '') => `<button class="heart ${cls} ${S.wish.has(id) ? 'on' : ''}" data-act="wish" data-id="${id}" aria-pressed="${S.wish.has(id)}" aria-label="Save item">${ic('heart')}</button>`;
const card = (p, ls) => `<article class="card ${ls ? 'ls' : ''}"><a href="#/p/${p.id}" style="display:${ls ? 'flex' : 'block'};flex:1"><img loading="lazy" src="${art(p, 'Front', !ls)}" alt="${esc(p.title)} (placeholder image)">${p.isNew && !ls ? '<span class="badge">New</span>' : ''}
  <div class="tx"><div class="b">${esc(p.brand)}</div><div class="t">${esc(p.title)}</div><div class="pr">${peso(p.price)}</div>${ls ? `<div class="b" style="text-transform:none;letter-spacing:0">${p.isNew ? 'Brand new' : esc(p.rank)} · ${esc(p.inc)}</div>` : ''}</div></a>${heartBtn(p.id)}</article>`;
const rowsOf = (l, ls) => l.map(p => card(p, ls)).join('');
const filt = (cat, pf) => ITEMS.filter(p => (cat === 'all' || p.cat === cat) && (!pf || PRESET[pf]?.[1](p)) && p.price <= F.max && (F.cond === 'any' || (F.cond === 'new') === p.isNew) && (!F.brands.size || F.brands.has(p.brand))
  && q.toLowerCase().split(/\s+/).filter(Boolean).every(w => (p.brand + ' ' + p.title).toLowerCase().includes(w)));
const nFilters = () => (F.max < 250000) + (F.cond !== 'any') + F.brands.size;
const pick = (k, v, label, cls = 'chip') => `<button type="button" class="${cls}" data-act="pick" data-k="${k}" data-v="${esc(v)}" aria-pressed="${D[k] === v}">${label ?? esc(v)}</button>`;
const tgl = (k, label) => `<button type="button" class="chip" data-act="tgl" data-k="${k}" aria-pressed="${!!D[k]}">${label}</button>`;
function layCalc(price, months) {
  const down = Math.round(price * 0.3), rest = price - down, m = Math.ceil(rest / months), last = rest - m * (months - 1);
  const rows = [['Today · down payment', down]];
  for (let i = 1; i <= months; i++) { const d = new Date(); d.setMonth(d.getMonth() + i); rows.push([AJ.fmtDate(d, {month: 'short', day: 'numeric', year: 'numeric'}), i === months ? last : m]); }
  return {down, rest, m, rows};
}

/* ---------- overlays ---------- */
function openSheet(html, cls = '') { $('#panel').className = 'panel ' + cls; $('#panel').innerHTML = html; $('#sheet').hidden = false; $('#panel').querySelector('button,a,input')?.focus({preventScroll: true}); }
const closeSheet = () => $('#sheet').hidden = true;
function gate(what) {
  if (!isGuest()) return false;
  openSheet(`<h2>Log in to ${esc(what)}</h2><p>Guest mode is view only. Log in or create a free account to continue.</p><button class="btn blk" data-act="login">Log in</button><button class="btn o blk" data-act="close">Keep browsing</button>`);
  return true;
}
const gateView = what => `<div class="gate"><div class="ic">${ic('lock')}</div><h1>Log in to ${esc(what)}</h1><p>You’re browsing as a guest. Guests can browse, search, read FAQs and chat with Ava.</p>
  <button class="btn" data-act="login">Log in</button><br><a class="lnk" href="#/home" style="display:inline-block;margin-top:14px">Keep browsing</a></div>`;
const eye = `<button type="button" class="eye" data-act="eye" aria-label="Show password">${ic('eye')}</button>`;
const back = () => `<button class="rb" data-act="back" aria-label="Back">${ic('back')}</button>`;

/* ---------- views: auth ---------- */
function vWelcome() {
  return `<div class="intro"><div class="snap" id="intro" data-dots="ind">${AJ.INTRO.map(([t, s, c], k) => `<section><img src="${AJ.art(c, k * 5 + 1, {s: 'pop', cap: false})}" alt=""><h1>${t}</h1><p>${s}</p></section>`).join('')}</div>
  <div class="dots" id="ind">${AJ.INTRO.map((_, k) => `<i class="${k ? '' : 'on'}"></i>`).join('')}</div>
  <div class="ibar"><a class="lnk" href="#/login">Skip</a><button class="btn" id="inext" data-act="inext">Next</button></div></div>`;
}
function vLogin() {
  return `<div class="lg"><div class="lgt"><div class="blob b1"></div><div class="blob b2"></div><div class="wm">A&amp;J</div><p>Buy &amp; consign luxury, the easy way.</p>
   <div class="fan">${[3, 10, 17].map((i, k) => `<img src="${art(ITEMS[i], 'Front', false)}" alt="" style="--r:${(k - 1) * 11}deg">`).join('')}</div></div>
  <div class="lgb"><h1>Welcome back</h1><form id="loginform" novalidate>${fld('Email or mobile number', 'email', {ac: 'username'})}
   <label class="fld"><span>Password</span><input type="password" name="pw" autocomplete="current-password" value="${esc(D.pw || '')}">${eye}<small class="err" data-for="pw"></small></label>
   <button class="btn blk" type="submit">Log in</button></form>
  <div class="two" style="margin-top:12px"><a href="#/forgot">Forgot password?</a><a href="#/signup">Create account</a></div><div class="or">or</div>
  <button class="btn o blk" data-act="guest">Continue as guest</button><p class="fine">Prototype: any email or mobile number and password works. <a class="lnk" href="#/welcome">View intro</a></p></div></div>`;
}
function vSignup() {
  return `<div class="tb">${back()}<div></div><div></div></div><div class="page"><h1>Create your account</h1><p>It takes a minute. We’ll text you a 4-digit code.</p>
  <form id="signupform" novalidate>${fld('Full name', 'name', {ac: 'name'})}${fld('Email', 'email', {type: 'email', ac: 'email'})}${fld('Mobile number', 'mobile', {type: 'tel', ac: 'tel', ph: '09XX XXX XXXX'})}
   <label class="fld"><span>Password (8+ characters)</span><input type="password" name="pw" autocomplete="new-password" value="${esc(D.pw || '')}">${eye}<small class="err" data-for="pw"></small></label>
   ${chk('terms', 'I agree to the <a class="lnk" href="#/info/terms">Terms</a> and <a class="lnk" href="#/info/privacy">Privacy notice</a>.', '<small class="err" data-for="terms"></small>')}
   <button class="btn blk" type="submit" style="margin-top:12px">Continue</button></form></div>`;
}
function vVerify() {
  const m = (D.mobile || '').replace(/[\s-]/g, '');
  return `<div class="tb"><a class="rb" href="#/signup" aria-label="Back">${ic('back')}</a><div></div><div></div></div><div class="page"><h1>Enter the code</h1>
  <p>We sent a 4-digit code to ${m ? '••• •••• ' + esc(m.slice(-4)) : 'your mobile number'}. <b>Prototype: type any 4 digits.</b></p>
  <form id="otpform" novalidate><div class="otp">${[0, 1, 2, 3].map(i => `<input type="text" inputmode="numeric" maxlength="1" name="otp${i}" data-otp="${i}" aria-label="Digit ${i + 1}" autocomplete="one-time-code" value="${esc(D['otp' + i] || '')}">`).join('')}</div>
   <small class="err" data-for="otp" style="text-align:center"></small>
   <button class="btn blk" type="submit" style="margin-top:14px">Verify and continue</button></form>
  <div class="two" style="margin-top:16px;justify-content:center;gap:24px"><button class="lnk" data-act="resend">Resend code</button><a href="#/signup">Wrong number?</a></div></div>`;
}
function vForgot() {
  return `<div class="tb"><a class="rb" href="#/login" aria-label="Back">${ic('back')}</a><div></div><div></div></div><div class="page"><h1>Reset password</h1>
  ${D.sent ? `<p>If an account exists for <b>${esc(D.email)}</b>, a reset link would be sent. In this prototype, nothing is sent.</p><a class="btn blk" href="#/login" data-act="clearsent">Back to log in</a>`
  : `<p>Enter your email or mobile number and we’ll send a reset link.</p><form id="forgotform" novalidate>${fld('Email or mobile number', 'email', {ac: 'username'})}<button class="btn blk" type="submit">Send reset link</button></form>`}</div>`;
}

/* ---------- views: home ---------- */
function vHome() {
  const g = isGuest(), nm = g ? 'there' : S.user.name.split(' ')[0], un = unread();
  const con = S.req.filter(r => r.type === 'Consignment')[0];

let DK = {i: 0, saved: 0};
function deck() {
  const left = DECK.slice(DK.i, DK.i + 3);

  return `<div class="dkw" id="dkw" data-nogesture>${left.map((p, k) => `<article class="dcard" data-id="${p.id}" style="transform:translateY(${k * 10}px) scale(${1 - k * .05});z-index:${9 - k}"><img src="${art(p)}" alt="${esc(p.title)} (placeholder image)">
    ${k === 0 ? '<span class="stamp s">SAVE</span><span class="stamp k">SKIP</span>' : ''}<div class="tx"><div class="b">${esc(p.brand)}</div><div class="t">${esc(p.title)}</div><div class="pr">${peso(p.price)}</div></div></article>`).reverse().join('')}</div>
  <div class="dctl"><button class="k" data-act="swipe" data-d="-1" aria-label="Skip">${ic('close')}</button><button class="d" data-act="peek" aria-label="See details">${ic('info')}</button><button class="s" data-act="swipe" data-d="1" aria-label="Save">${ic('heart')}</button></div>`;
}
function vDiscover() {
  return `<div class="tb">${back()}<div class="tt">Discover</div><a class="rb" href="#/saved" aria-label="Saved">${ic('heart')}${S.wish.size ? `<span class="dot">${S.wish.size}</span>` : ''}</a></div>
  <div class="dcount"><span>Swipe right to save, left to skip</span><span id="dc">${Math.min(DK.i + 1, DECK.length)} / ${DECK.length}</span></div><div id="deck">${deck()}</div>`;
}
function swipe(d) {
  const top = $('#dkw .dcard:last-child'); if (!top) return;
  const p = item(top.dataset.id);
  if (d > 0 && isGuest()) { top.style.transform = ''; return void gate('save items'); }
  if (d > 0) { S.wish.add(p.id); DK.saved++; toast('Saved'); }
  top.classList.remove('drag'); top.style.transform = `translateX(${d * 130}%) rotate(${d * 18}deg)`; top.style.opacity = 0;
  setTimeout(() => { DK.i++; const dk = $('#deck'); if (!dk) return; dk.innerHTML = deck(); $('#dc').textContent = `${Math.min(DK.i + 1, DECK.length)} / ${DECK.length}`; }, 280);
}
function bindDrag(e) {
  const el = e.target.closest('.dcard'); if (!el || el !== $('#dkw .dcard:last-child')) return;
  const x0 = e.clientX; let dx = 0; el.classList.add('drag'); el.setPointerCapture?.(e.pointerId);
  const mv = ev => { dx = ev.clientX - x0; el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; el.querySelector('.stamp.s').style.opacity = Math.max(0, dx / 90); el.querySelector('.stamp.k').style.opacity = Math.max(0, -dx / 90); };
  const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
    if (Math.abs(dx) > 90) swipe(dx > 0 ? 1 : -1); else { el.classList.remove('drag'); el.style.transform = ''; el.querySelectorAll('.stamp').forEach(s => s.style.opacity = 0); } };
  el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}

  lm(el) { const c = layCalc(+el.dataset.p, +el.dataset.v); $$('[data-act=lm]').forEach(b => b.setAttribute('aria-pressed', b === el)); $('#lm').innerHTML = `${peso(c.m)}<span style="font:500 15px var(--ui)"> / month</span>`; $('#ld').textContent = `${peso(c.down)} down today · ${el.dataset.v} months`; },
  chat2buy(el) { if (!gate('send an inquiry')) inquirySheet(el.dataset.id); },
  swipe(el) { swipe(+el.dataset.d); }, peek() { const c = $('#dkw .dcard:last-child'); if (c) go('#/p/' + c.dataset.id); }, restart() { DK = {i: 0, saved: 0}; refresh(false); },
  tab(el) { tab = el.dataset.v; refresh(false); },
  reqlay(el) {
    const p = item(el.dataset.id), m = +el.dataset.m, c = layCalc(p.price, m);
    const r = addAct('Layaway', p.title, `${m} months · ${peso(c.m)}/month`, [['Piece', p.brand + ' ' + p.title], ['Price', peso(p.price)], ['Down payment', peso(c.down)], ['Monthly', peso(c.m) + ' × ' + m]]);
    note('percent', 'Layaway requested', p.title, '#/act/' + r.ref); go('#/act/' + r.ref + '?new');
  },
  pick(el) { const {k, v} = el.dataset; D[k] = v; $$(`[data-act=pick][data-k="${k}"]`).forEach(b => b.setAttribute('aria-pressed', b === el)); $(`[data-for="${k}"]`)?.replaceChildren(); if (k === 'lm') $('#lres').innerHTML = layResult(item(D.lpiece), +v); },
  tgl(el) { const k = el.dataset.k; D[k] = !D[k]; el.setAttribute('aria-pressed', !!D[k]); },
  cat(el) { D.ccat = el.dataset.v; CW.step = 1; refresh(false); }, cond(el) { D.ccond = el.dataset.v; CW.step = 3; refresh(false); },
  cback() { CW.step--; refresh(false); }, cexit() { go('#/home'); },
  slot(el) { const i = +el.dataset.i; CW.photos.has(i) ? CW.photos.delete(i) : CW.photos.add(i); refresh(); $(`.slot[data-i="${i}"]`)?.focus({preventScroll: true}); },
  ask(el) { const f = AJ.faq(el.dataset.id); say(f.q, f.id); }, agroup(el) { AV.g = el.dataset.g; $('#aqs').innerHTML = aqs(); }, amenu() { AV.g = null; $('#aqs').innerHTML = aqs(); },
  human() { say('Talk to a person', 'human'); },
  fb(el) { S.msgs[+el.dataset.i].fb = el.dataset.v; drawLog(); toast('Thanks for the feedback (demo)'); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) ACT[el.dataset.act]?.(el); });
document.addEventListener('pointerdown', e => { if (AJ.route().name === 'discover') bindDrag(e); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { q = t.value; $('#list').innerHTML = shopList($('#list').dataset.cat, $('#list').dataset.pf || null); }
  if (t.id === 'sq') { sq = t.value; $('#sres').innerHTML = results(sq); }
  if (t.id === 'fq') $('#fl').innerHTML = faqList(t.value);
  if (t.id === 'range') { F.max = +t.value; $('#mx').textContent = peso(F.max); const n = filt($('#list').dataset.cat, $('#list').dataset.pf || null).length; $('#fdone').textContent = `Show ${n} item${n === 1 ? '' : 's'}`; }
  if (t.id === 'lpiece') { D.lpiece = t.value; $('#lres').innerHTML = layResult(item(t.value), +D.lm); }
  if (t.dataset.otp !== undefined) { t.value = t.value.replace(/\D/g, ''); D['otp' + t.dataset.otp] = t.value; if (t.value) $(`[data-otp="${+t.dataset.otp + 1}"]`)?.focus(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.target.dataset?.otp !== undefined && e.key === 'Backspace' && !e.target.value) $(`[data-otp="${+e.target.dataset.otp - 1}"]`)?.focus();
  if (AJ.route().name === 'discover' && !e.target.closest('input,select,textarea')) { if (e.key === 'ArrowRight') swipe(1); if (e.key === 'ArrowLeft') swipe(-1); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, id = f.id;
  if (id === 'chatform') { const t = $('#msg').value.trim(); if (t) { $('#msg').value = ''; say(t); } return; }
  if (id === 'loginform') {
    if (!validate(f, {email: [v => AJ.isEmail(v) || AJ.isMobile(v), 'Enter your email or PH mobile number.'], pw: req('Enter your password.')})) return;
    const v = D.email.trim(), em = AJ.isEmail(v), n = em ? v.split('@')[0].replace(/[._-]+/g, ' ') : 'Member';
    enter({name: n.replace(/\b\w/g, c => c.toUpperCase()), email: em ? v : '—', mobile: em ? '' : v});
  }
  if (id === 'signupform') {
    if (!validate(f, {name: req('Enter your name.'), email: emailRule, mobile: mobileRule, pw: [v => v.length >= 8, 'Use at least 8 characters.'], terms: ticked('Please agree to continue.')})) return;
    go('#/verify');
  }
  if (id === 'otpform') {
    if (!validate(f, {otp: [() => [0, 1, 2, 3].every(i => /^\d$/.test(D['otp' + i] || '')), 'Enter all 4 digits.']})) return;
    enter({name: D.name.trim(), email: D.email.trim(), mobile: D.mobile.trim()}); toast('Welcome to A&J, ' + S.user.name.split(' ')[0]);
  }
  if (id === 'forgotform') { if (!validate(f, {email: [v => AJ.isEmail(v) || AJ.isMobile(v), 'Enter your email or PH mobile number.']})) return; D.sent = 1; refresh(false); }
  if (id === 'inqform') {
    if (!validate(f, {iname: req('Enter your name.'), imobile: mobileRule})) return;
    const p = item(f.dataset.id);
    const r = addAct('Inquiry', p.title, p.brand + ' · ' + peso(p.price), [['Piece', p.brand + ' ' + p.title], ['Payment', D.ipay], ['Message', (D.inote || '').trim()]]);
    note('chat', 'Inquiry sent', p.title, '#/act/' + r.ref); delete D.inote; go('#/act/' + r.ref + '?new');
  }
  if (id === 'setform') {
    if (!validate(f, {sname: req('Enter your name.'), smobile: [v => !v || AJ.isMobile(v), mobileRule[1]]})) return;
    S.user.name = D.sname.trim(); S.user.mobile = D.smobile.trim(); toast('Changes saved'); refresh();
  }
  if (id === 'msgform') {
    const rules = {mtext: req('Write a short message.')}; if (isGuest()) rules.memail = emailRule;
    if (!validate(f, rules)) return; D.msent = 1; refresh(false);
  }
  if (id === 'conform') {
    const s = CW.step, rules = {};
    if (s === 0) rules.ccat = req('Choose a category.');
    if (s === 1) Object.assign(rules, {cbrand: req('Enter the brand.'), cname: req('Enter the item name or model.'), cprice: [v => !v || /^\d[\d,]*$/.test(v.trim()), 'Use numbers only.']});
    if (s === 2) rules.ccond = req('Choose the condition.');
    if (s === 3) { const miss = AJ.PHOTO_SLOTS.filter((o, i) => o.req && !CW.photos.has(i)).map(o => o.label); if (miss.length) { $('[data-for="photos"]').textContent = 'Still needed: ' + miss.join(', ') + '.'; return; } }
    if (s === 4) rules.cown = ticked('Please confirm ownership to continue.');
    if (s === 5) Object.assign(rules, {cmobile: mobileRule, cterms: ticked('Please accept the terms to submit.')});
    if (!validate(f, rules)) return;
    if (s < CSTEPS - 1) { CW.step++; refresh(false); return; }
    const r = addAct('Consignment', `${D.cbrand.trim()} ${D.cname.trim()}`, `${D.cmode} · ${D.ccond}`, [['Request', D.cmode], ['Category', D.ccat], ['Condition', D.ccond], ['Photos', CW.photos.size + ' of 10'], ['Hand-over', D.chand], ['Expected price', D.cprice ? peso(+D.cprice.replace(/,/g, '')) : '']], {cat: CATS.find(c => c[1] === D.ccat)[0]});
    note('box', 'Consignment submitted', r.title, '#/act/' + r.ref); resetWizard(); go('#/act/' + r.ref + '?new');
  }
});
document.addEventListener('scroll', e => { // gallery dots
  const el = e.target; if (!el.dataset?.dots) return;
  const i = Math.round(el.scrollLeft / el.clientWidth);
  $$(`#${el.dataset.dots} i`).forEach((d, k) => d.classList.toggle('on', k === i));
  if (el.id === 'intro') $('#inext').textContent = i === el.children.length - 1 ? 'Get started' : 'Next';
}, true);
AJ.gestures({ // swipe: back from the left edge, pull down to refresh lists, sheets and photo viewer drag down to close
  act: (n, el, d) => ACT[n]?.(el, d),
  edge: () => {
    const r = AJ.route().name;
    if (!S.user) return {signup: () => go('#/login'), verify: () => go('#/signup'), forgot: () => go('#/login'), info: ACT.back}[r] || null;
    return ['home', 'shop', 'assistant', 'me'].includes(r) ? null : r === 'consign' && CW.step ? ACT.cback : ACT.back;
  },
  pull: () => ['home', 'shop', 'saved', 'activity', 'notifications'].includes(AJ.route().name) ? () => refresh() : null
});
addEventListener('hashchange', () => render());
if (!location.hash) history.replaceState(null, '', '#/welcome');
render(false);
</script>
</body>
</html>
