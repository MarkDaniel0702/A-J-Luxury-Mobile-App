<!doctype html>
<html lang="en-PH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>A&amp;J Luxury · Prototype 2 · Classic Boutique</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="../shared/phone.css">
<style>
/* Prototype 2 "Classic Boutique": white, black, hairlines, light uppercase Jost. Bottom tab bar, grid shopping, step-by-step consign form.
   No A&J website images, logo or text assets. Pictures are generated placeholders (shared/core.js). */
:root{--ink:#1b1b1b;--mute:#6f6c66;--line:#e8e5df;--surf:#f5f3ef;--err:#b3261e;--ok:#2e6b3a;--sw:1.5;
 --font:"Jost","Avenir Next","Century Gothic","Segoe UI",system-ui,sans-serif;--fg:#000;--card:#fff;--field:#cfcbc3;--stage:#e4e1da;--bg:#fff;--sbc:#111;--hbc:#111;--capc:#78746c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font:400 15px/1.5 var(--font);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px}

#app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--sat);background:var(--bg)}
main{flex:1;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
main:focus-visible{outline:0}
main::-webkit-scrollbar{display:none}
.top{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;min-height:56px;border-bottom:1px solid var(--line)}
.top.bare{display:none}
.tt{text-align:center;font-size:15px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt.wm{font-size:26px;font-weight:300;letter-spacing:8px;padding-left:8px}
.ib{position:relative;width:48px;height:48px;margin:0 4px;display:grid;place-items:center;background:none;border:0;border-radius:50%;cursor:pointer}
.ib:active{background:#8882}
.dot{position:absolute;top:8px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--fg);color:var(--card);font-size:10px;line-height:17px;text-align:center}
#gb{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surf);padding:2px 16px;font-size:12px;color:var(--mute)}
#gb button{background:none;border:0;font-weight:600;color:var(--fg);text-decoration:underline;cursor:pointer;min-height:36px}
.nav{display:flex;border-top:1px solid var(--line);padding-bottom:var(--sab);background:var(--card)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 8px;font-size:11px;letter-spacing:.5px;color:var(--mute)}
.nav a[aria-current]{color:var(--fg);font-weight:600}
.nav a[aria-current] .i{stroke-width:2}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:1px solid var(--fg);background:var(--fg);color:var(--card);font-weight:500;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.btn.o{background:var(--card);color:var(--fg)}
.btn.blk{display:flex;width:100%}
.btn.sm{min-height:40px;padding:0 16px;font-size:12px}
.btn:active{opacity:.8}
.btn[disabled]{opacity:.4;cursor:default}
.lnk{background:none;border:0;text-decoration:underline;color:var(--fg);cursor:pointer}

/* Forms */
.login,.formpage{padding:24px}
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-top:16px}
.brand{text-align:center;margin-bottom:28px}
.brand b{display:block;font-size:40px;font-weight:300;letter-spacing:10px;padding-left:10px}
.brand span{font-size:12px;letter-spacing:4px;color:var(--mute);text-transform:uppercase}
.fld{display:block;margin-bottom:14px;position:relative}
.fld>span{display:block;font-size:12px;letter-spacing:.5px;color:var(--mute);margin-bottom:4px}
input[type=email],input[type=password],input[type=search],input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--field);border-radius:2px;background:var(--card);font-size:16px}
textarea{min-height:88px;resize:none}
[aria-invalid=true]{border-color:var(--err)!important}
.err{display:block;min-height:0;font-size:12px;color:var(--err);margin-top:3px}
.eye{position:absolute;right:2px;bottom:0;width:48px;height:48px;display:grid;place-items:center;border:0;background:none;cursor:pointer}
.or{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--mute);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fine{margin-top:16px;font-size:13px;color:var(--mute);text-align:center}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px}
.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--fg);flex:none}
.opts{display:grid;gap:8px;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--field);cursor:pointer}
.opt:has(input:checked){border-color:var(--fg);background:var(--surf)}
.opt input{accent-color:var(--fg);width:20px;height:20px}
.opt small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{appearance:none;width:48px;height:28px;border-radius:14px;background:var(--field);cursor:pointer;transition:background .2s}
.sw input:checked{background:var(--fg)}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:transform .2s;pointer-events:none}
.sw:has(input:checked)::after{transform:translateX(20px)}

/* Home */
.snap{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.snap::-webkit-scrollbar{display:none}
.snap>*{flex:none;scroll-snap-align:start}
.slide{width:100%;display:flex;align-items:center;gap:8px;padding:24px 0 24px 24px;min-height:220px;background:var(--sb,#ece8e1);color:var(--sf,#1b1b1b)}
.slide>div{flex:1}
.slide small{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.7}
.slide h1{font-size:29px;font-weight:300;line-height:1.15;margin:6px 0 16px}
.slide img{width:140px;height:140px;flex:none;margin-right:20px;border:1px solid #0002}
.dots{display:flex;justify-content:center;gap:6px;padding:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--field)}
.dots i.on{background:var(--fg);width:18px;border-radius:3px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:26px 16px 10px}
.sec h2{font-size:20px;font-weight:300;letter-spacing:1px;text-transform:uppercase}
.sec a{font-size:13px;text-decoration:underline;color:var(--mute)}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 16px}
.tile{position:relative;aspect-ratio:1;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:5px 4px;background:#000b;color:#fff;font-size:11px;letter-spacing:1.5px;text-align:center;text-transform:uppercase}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.row .card{flex:0 0 150px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px 0}
.trust a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border:1px solid var(--line);text-align:center;font-size:12px;line-height:1.3}
.band{margin:28px 0 0;padding:32px 24px;background:#000;color:#fff;text-align:center}
.band h2{font-size:24px;font-weight:300;line-height:1.2;margin-bottom:8px}
.band p{color:#bbb;margin-bottom:18px}
.help{display:flex;align-items:center;gap:14px;margin:24px 16px 0;padding:16px;border:1px solid var(--line)}
.help p{flex:1;font-size:14px}
.steps{padding:0 16px;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:8px 0}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border:1px solid var(--fg);border-radius:50%;display:grid;place-items:center;font-size:12px}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;padding:28px 16px 8px;font-size:13px}
.foot a{text-decoration:underline;color:var(--mute)}
.note{margin:16px;padding:12px;background:var(--surf);font-size:12px;color:var(--mute)}

/* Cards + shop */
.card{position:relative;min-width:0}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--surf)}
.card .b{margin-top:8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.card .t{font-size:14px;font-weight:300;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{font-weight:500}
.badge{position:absolute;left:6px;top:6px;padding:1px 7px;background:var(--card);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.heart{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;cursor:pointer}
.card .heart{position:absolute;top:0;right:0}
.card .heart .i{background:var(--card);border-radius:50%;padding:4px;width:30px;height:30px}
.heart.on .i{fill:currentColor}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;padding:16px}
.tool{display:flex;gap:8px;padding:12px 16px 0}
.tool select{width:auto;padding:0 8px}
.tool .ib{margin:0;width:48px;border:1px solid var(--field);border-radius:2px;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.chip{flex:none;display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid var(--field);border-radius:20px;background:var(--card);cursor:pointer;white-space:nowrap;font-size:14px}
.chip[aria-pressed=true],.chip[aria-current]{background:var(--fg);color:var(--card);border-color:var(--fg)}
.cnt{padding:12px 16px 0;color:var(--mute);font-size:13px}
.empty{padding:48px 24px;text-align:center;color:var(--mute)}
.empty .i{width:40px;height:40px;margin:0 auto 12px;stroke-width:1}
.empty .btn{margin-top:16px}

/* Product */
.gal{background:var(--surf)}
.gal .snap>*{width:100%}
.gal img{width:100%;aspect-ratio:6/5;object-fit:cover;cursor:zoom-in}
.gbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 0;border-bottom:1px solid var(--line)}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.thumbs button{flex:none;width:52px;height:52px;padding:0;border:1px solid var(--line);background:none;cursor:pointer}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pad{padding:16px}
.tag{display:inline-block;border:1px solid var(--fg);padding:2px 8px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.pbrand{margin-top:8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.pt{font-size:23px;font-weight:300;line-height:1.25;margin:4px 0 8px}
.price{font-size:21px;font-weight:500}
.facts{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.facts dt{color:var(--mute)}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{display:flex;justify-content:space-between;align-items:center;min-height:54px;padding:0 16px;font-weight:500;letter-spacing:.5px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary .i{transform:rotate(180deg)}
.dbody{padding:0 16px 16px;color:var(--mute)}
.dbody p+p{margin-top:8px}
.dbody a{text-decoration:underline;color:var(--ink)}
.buy{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.buy .btn{flex:1;padding:0 8px}
.buy .btn.o{flex:0 0 auto;padding:0 14px}

/* Chat */
.chat{display:flex;flex-direction:column;min-height:100%}
.log{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-line;line-height:1.45}
.m.bot{align-self:flex-start;background:var(--surf);border-bottom-left-radius:3px}
.m.me{align-self:flex-end;background:var(--fg);color:var(--card);border-bottom-right-radius:3px}
.m small{display:block;margin-top:6px;color:var(--mute);font-size:11px;line-height:1.3}
.m .btn{margin-top:10px;white-space:normal}
.typing i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#9a968e;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.qs{position:sticky;bottom:64px;display:flex;gap:8px;overflow-x:auto;padding:8px 16px;background:linear-gradient(transparent,var(--card) 30%);scrollbar-width:none}
.send{position:sticky;bottom:0;display:flex;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line)}
.send input{flex:1;border-radius:24px}
.send .btn{padding:0;width:48px;border-radius:50%}

/* Lists, account, timeline */
.list{padding:0}
.lr{display:flex;align-items:center;gap:14px;min-height:56px;padding:6px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.lr span{flex:1}
.lr small{color:var(--mute)}
.lh{padding:20px 16px 6px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.me{display:flex;align-items:center;gap:14px;padding:20px 16px}
.av{width:56px;height:56px;border-radius:50%;background:var(--fg);color:var(--card);display:grid;place-items:center;font-size:22px;font-weight:300}
.me b{display:block;font-size:18px;font-weight:400}
.me small{color:var(--mute)}
.item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.item img{width:72px;height:72px;object-fit:cover;flex:none}
.item div{flex:1;min-width:0}
.item b{display:block;font-weight:400;font-size:14px;line-height:1.3}
.item small{color:var(--mute)}
.pill{display:inline-block;margin-top:4px;padding:1px 10px;border:1px solid var(--fg);border-radius:12px;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.tl{list-style:none;margin:8px 0;padding-left:4px}
.tl li{position:relative;padding:0 0 18px 30px;color:var(--mute)}
.tl li::before{content:"";position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;border:1px solid #9a968e;background:var(--card)}
.tl li::after{content:"";position:absolute;left:7px;top:20px;bottom:-1px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.on{color:var(--ink);font-weight:500}
.tl li.on::before{background:var(--fg);border-color:var(--fg)}
.hero2{text-align:center;padding:28px 24px 8px}
.hero2 .ok{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:var(--fg);color:var(--card);display:grid;place-items:center}
.hero2 h1{font-size:24px;font-weight:300}
.hero2 p{color:var(--mute);margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:12px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0}
.kv dt{color:var(--mute)}
.kv dd{text-align:right}
.info{padding:8px 16px 24px}
.info h3{font-size:14px;letter-spacing:2px;text-transform:uppercase;margin:20px 0 6px}
.info p{margin-top:10px}
.info ul{margin:8px 0 0 20px}
.pend{padding:10px 12px;background:var(--surf);color:var(--mute);font-size:12px}
.gate{padding:64px 24px;text-align:center}
.gate h1{font-size:22px;font-weight:300;margin:12px 0 6px}
.gate p{color:var(--mute);margin-bottom:20px}
.gate .btn{margin-top:8px}

/* Consign wizard */
.prog{display:flex;gap:4px;padding:16px 16px 0}
.prog i{flex:1;height:3px;background:var(--line)}
.prog i.on{background:var(--fg)}
.stp{padding:8px 16px 0;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.slot{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;border:1px dashed #9a968e;background:var(--card);font-size:11px;line-height:1.2;text-align:center;cursor:pointer;overflow:hidden}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot em{position:absolute;left:0;right:0;bottom:0;padding:2px;background:#000b;color:#fff;font-style:normal}
.slot.on{border-style:solid;border-color:var(--fg)}
.slot b{font-weight:500;color:var(--err)}
.wiz{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.wiz .btn{flex:1}

/* Sheet + toast */
.sheet{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;background:#0008}
.panel{position:relative;width:100%;max-height:88%;overflow-y:auto;padding:24px 16px calc(20px + var(--sab));background:var(--card);border-radius:18px 18px 0 0;display:grid;gap:8px}
.panel h2{font-size:19px;font-weight:400}
.panel p{color:var(--mute);margin-bottom:8px}
.panel.lb{height:100%;max-height:none;border-radius:0;background:#000;padding:var(--sat) 0 var(--sab);align-content:center}
.lb .x{position:absolute;top:calc(var(--sat) + 4px);right:8px;color:#fff;z-index:2}
.lb img{width:100%;aspect-ratio:1;object-fit:cover}
.lb p{color:#ccc;text-align:center;font-size:13px}
.grpt{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 70px);z-index:60;padding:12px 16px;background:var(--ink);color:var(--card);font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}

/* Motion, tap feedback, swipe affordances, intro */
main>*{animation:in .3s cubic-bezier(.2,.7,.2,1) both}
main.still>*{animation:none}
main.bwd>*{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(16px)}}
@keyframes inb{from{opacity:0;transform:translateX(-16px)}}
.card>a,.tile,.trust a,.help,.chip,.item,.thumbs button{transition:transform .15s}
.card>a:active,.tile:active,.trust a:active,.help:active,.chip:active,.item:active,.thumbs button:active{transform:scale(.97)}
.lr:active{opacity:.6}
.nav{position:relative;z-index:5}
.nav a{position:relative}
.nav a::before{content:"";position:absolute;top:-1px;left:50%;width:0;height:2px;background:var(--fg);transition:left .25s,width .25s}
.nav a[aria-current]::before{left:25%;width:50%}
.panel:not(.lb)::before{content:"";justify-self:center;width:36px;height:4px;margin:-12px 0 4px;border-radius:2px;background:var(--field)}
.lb .snap>*{width:100%}
.intro{height:100%;display:flex;flex-direction:column}
.intro .snap{flex:1}
.intro section{width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 36px;text-align:center}
.intro img{width:230px;height:230px;margin-bottom:32px;border:1px solid var(--line)}
.intro h1{font-size:28px;font-weight:300;line-height:1.2;letter-spacing:.5px;margin-bottom:10px}
.intro p{color:var(--mute)}
.ibar{display:flex;justify-content:space-between;align-items:center;padding:4px 24px 20px}

/* Support tickets + admin */
.pill.on{background:var(--fg);color:var(--card)}
.m.you{align-self:flex-end;background:var(--fg);color:var(--card);border-bottom-right-radius:3px}
.m.you small{color:inherit;opacity:.7}
.sysm{align-self:center;font-size:11px;letter-spacing:.5px;color:var(--mute);text-align:center}
.two{display:flex;gap:8px}
.two>*{flex:1;min-width:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0}
.kpi{padding:12px;border:1px solid var(--line);min-width:0}
.kpi small{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:22px;font-weight:400;line-height:1.25;overflow-wrap:anywhere}
.kpi span{display:block;font-size:11px;line-height:1.3;color:var(--mute)}
.ch{margin:0 16px;padding:10px 12px 8px;border:1px solid var(--line);--ch:var(--fg);--chg:var(--line);--cht:var(--mute)}
.ch-r{min-height:18px;margin-bottom:4px;font-size:12px;color:var(--mute)}
.ch-s{display:block;width:100%;height:auto;overflow:visible}
.ch-b{fill:var(--ch)}
.ch g:hover .ch-b{opacity:.7}
.ch-g{stroke:var(--chg);stroke-width:1}
.ch-ax{font:11px var(--font);fill:var(--cht)}
.ch-v{font:500 11px var(--font);fill:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.tbl th:last-child,.tbl td:last-child{text-align:right}
.tbl td{white-space:nowrap}
.tbl td.w{white-space:normal}

/* Dark mode (Account > Dark mode) */
.screen.dark{--ink:#ece8e1;--mute:#a29e96;--line:#2e2c29;--surf:#1d1c1a;--bg:#121211;--fg:#f3efe8;--card:#121211;--field:#4b4842;--err:#f2867b;--ok:#7fc08c;
 --sbc:#f3efe8;--hbc:#f3efe8;--gbg:#1d1c1a;--gfg:#f3efe8;color:var(--ink);color-scheme:dark}
.dark .band{background:var(--surf)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stage">
 <div class="phone">
  <div class="screen" id="screen">
   <div id="app">
    <header class="top" id="top"></header>
    <div id="gb" hidden><span>Guest mode · view only</span><button data-act="login">Log in</button></div>
    <main id="main" tabindex="-1"></main>
    <nav class="nav" id="nav" aria-label="Primary" hidden></nav>
    <div class="sheet" id="sheet" hidden><div class="scrim" data-act="close"></div><div class="panel" id="panel" role="dialog" aria-modal="true" data-dismiss="close" data-dir="down"></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
   </div>
  </div>
 </div>
 <div class="cap"><b>Prototype 2 · Classic Boutique</b>Log in with any email and password, or continue as guest. Admin: “Admin login” on the log-in screen (admin@ajluxury.test / Admin2026), in the same tab, to see tickets you sent. Nothing is sent or saved. Drag with the mouse to swipe.</div>
</div>

<script src="../shared/core.js"></script>
<script>
const {$, $$, esc, peso, ic, S, ITEMS, CATS, BRANDS, isGuest, toast, pic, item, catName, D, req, ticked, mobileRule, emailRule, validate, fld, sel, chk} = AJ;
const art = (p, v, cap) => pic(p, 'line', v, cap);
let q = '', sort = 'featured';
const F = {brands: new Set(), cond: 'any', price: 'any'};
let W = {step: 0, photos: new Set()}; // consign wizard
let tf = 'all', af = 'active', aq = '', aper = 30, rep = null; // support ticket filter; admin queue, search, dashboard period, last report
S.msgs.push({who: 'bot', text: AJ.GREETING});
const MEMBER = 'wishlist inquire inquiries inquiry consignform consignments consignment settings ticketnew ticket'.split(' '); // routes guests can't open
const STAFF = 'admin atickets aticket areports ateam'.split(' '); // admin routes: staff only

/* ---------- small helpers ---------- */
const heartBtn = id => `<button class="heart ${S.wish.has(id) ? 'on' : ''}" data-act="wish" data-id="${id}" aria-pressed="${S.wish.has(id)}" aria-label="Wishlist">${ic('heart')}</button>`;
const card = p => `<article class="card"><a href="#/p/${p.id}"><img loading="lazy" src="${art(p)}" alt="${esc(p.title)} (placeholder image)">${p.isNew ? '<span class="badge">New</span>' : ''}
  <div class="b">${esc(p.brand)}</div><div class="t">${esc(p.title)}</div><div class="pr">${peso(p.price)}</div></a>${heartBtn(p.id)}</article>`;
const radios = (name, list) => `<div class="opts">${list.map(([v, t, s]) => `<label class="opt"><input type="radio" name="${name}" value="${v}" ${(D[name] || list[0][0]) === v ? 'checked' : ''}><span>${t}${s ? `<small>${s}</small>` : ''}</span></label>`).join('')}</div>`;
const money = n => n ? peso(+n) : '';
const filtered = () => {
  const w = q.toLowerCase().split(/\s+/).filter(Boolean);
  return ITEMS.filter(p => (cat === 'all' || p.cat === cat) && w.every(x => (p.brand + ' ' + p.title).toLowerCase().includes(x))
    && (!F.brands.size || F.brands.has(p.brand)) && (F.cond === 'any' || (F.cond === 'new') === p.isNew)
    && (F.price === 'any' || (F.price === 'lo' ? p.price < 30000 : F.price === 'mid' ? p.price >= 30000 && p.price <= 100000 : p.price > 100000)));
};
let cat = 'all';
const nFilters = () => F.brands.size + (F.cond !== 'any') + (F.price !== 'any');

/* ---------- sheets ---------- */
function openSheet(html, cls = '') {
  $('#panel').className = 'panel ' + cls; $('#panel').innerHTML = html; $('#sheet').hidden = false;
  $('#panel').querySelector('button,input,a')?.focus({preventScroll: true});
}
const closeSheet = () => $('#sheet').hidden = true;
// Guests are view-only: any account action asks them to log in.
function gate(what) {
  if (!isGuest()) return false;
  openSheet(`<h2>Log in to ${esc(what)}</h2><p>Guest mode is view only. Log in or create a free account to continue.</p>
   <button class="btn blk" data-act="login">Log in</button><button class="btn o blk" data-act="close">Keep browsing</button>`);
  return true;
}
const gateView = what => `<div class="gate">${ic('lock')}<h1>Log in to ${esc(what)}</h1><p>You’re browsing as a guest. Guests can browse, search, read FAQs and use Help.</p>
  <button class="btn" data-act="login">Log in</button><br><a class="lnk" href="#/home">Keep browsing</a></div>`;

/* ---------- views: auth ---------- */
function vWelcome() {
  return `<div class="intro"><div class="snap" id="intro" data-dots="ind">${AJ.INTRO.map(([t, s, c], k) => `<section><img src="${AJ.art(c, k * 5 + 1, {cap: false})}" alt=""><h1>${t}</h1><p>${s}</p></section>`).join('')}</div>
  <div class="dots" id="ind">${AJ.INTRO.map((_, k) => `<i class="${k ? '' : 'on'}"></i>`).join('')}</div>
  <div class="ibar"><a class="lnk" href="#/login">Skip</a><button class="btn" id="inext" data-act="inext">Next</button></div></div>`;
}
function vLogin() {
  return `<div class="login"><div class="brand"><b>A&amp;J</b><span>Luxury · Buy &amp; Consign</span></div>
  <form id="loginform" novalidate>
   ${fld('Email', 'email', {type: 'email', ac: 'email'})}
   <label class="fld"><span>Password</span><input type="password" name="pw" autocomplete="current-password" value="${esc(D.pw || '')}"><button type="button" class="eye" data-act="eye" aria-label="Show password">${ic('eye')}</button><small class="err" data-for="pw"></small></label>
   <button class="btn blk" type="submit">Log in</button></form>
  <p class="fine"><a class="lnk" href="#/forgot">Forgot password?</a></p>
  <div class="or">or</div>
  <button class="btn o blk" data-act="guest">Continue as guest (view only)</button>
  <p class="fine">No account? <a class="lnk" href="#/signup">Create one</a></p>
  <p class="fine" style="font-size:12px">Prototype: any email and password works. <a class="lnk" href="#/welcome">View intro</a></p>
  <p class="fine" style="font-size:12px">A&amp;J staff? <a class="lnk" href="#/adminlogin">Admin login</a></p></div>`;
}
function vAdminLogin() {
  return `<div class="login"><div class="brand"><b>A&amp;J</b><span>Staff · Admin console</span></div>
  <form id="adminform" novalidate>${fld('Staff email', 'aemail', {type: 'email', ac: 'username'})}
   <label class="fld"><span>Password</span><input type="password" name="apw" autocomplete="current-password" value="${esc(D.apw || '')}"><button type="button" class="eye" data-act="eye" aria-label="Show password">${ic('eye')}</button><small class="err" data-for="apw"></small></label>
   <button class="btn blk" type="submit">Log in to admin</button></form>
  <p class="fine" style="font-size:12px">Prototype staff account: <b>${AJ.ADMIN.email}</b>, password <b>${AJ.ADMIN.pw}</b>. Customer and guest logins can’t open admin screens.</p>
  <p class="fine"><a class="lnk" href="#/login">Back to customer log in</a></p></div>`;
}
function vSignup() {
  return `<div class="formpage"><a class="lnk" href="#/login" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:12px">${ic('back', 's')} Back to log in</a>
  <h1 style="font-size:26px;font-weight:300;margin-bottom:16px">Create account</h1>
  <form id="signupform" novalidate>${fld('Full name', 'name', {ac: 'name'})}${fld('Email', 'email', {type: 'email', ac: 'email'})}${fld('Mobile number', 'mobile', {type: 'tel', ac: 'tel', ph: '09XX XXX XXXX'})}
   <label class="fld"><span>Password (8+ characters)</span><input type="password" name="pw" autocomplete="new-password" value="${esc(D.pw || '')}"><button type="button" class="eye" data-act="eye" aria-label="Show password">${ic('eye')}</button><small class="err" data-for="pw"></small></label>
   ${chk('terms', 'I agree to the <a class="lnk" href="#/info/terms">Terms</a> and <a class="lnk" href="#/info/privacy">Privacy notice</a>.', '<small class="err" data-for="terms"></small>')}
   <button class="btn blk" type="submit" style="margin-top:12px">Create account</button></form></div>`;
}
function vForgot() {
  const sent = D.sent;
  return `<div class="formpage"><a class="lnk" href="#/login" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:12px">${ic('back', 's')} Back to log in</a>
  <h1 style="font-size:26px;font-weight:300;margin-bottom:8px">Reset password</h1>
  ${sent ? `<p>If an account exists for <b>${esc(D.email)}</b>, a reset link would be sent. In this prototype, no email is sent.</p><a class="btn blk" href="#/login" style="margin-top:20px" data-act="clearsent">Back to log in</a>`
  : `<p style="color:var(--mute);margin-bottom:16px">Enter your email and we’ll send a reset link.</p><form id="forgotform" novalidate>${fld('Email', 'email', {type: 'email', ac: 'email'})}<button class="btn blk" type="submit">Send reset link</button></form>`}</div>`;
}

/* ---------- views: browse ---------- */
function vHome() {
  const slides = [
    ['#ece8e1', '#1b1b1b', 'New arrivals', 'Fresh pieces,<br>checked and graded', 'Shop now', '#/shop', 0],
    ['#1b1b1b', '#fff', 'Consign with us', 'Turn pre-loved<br>into cash', 'How it works', '#/consign', 4],
    ['#dfe4df', '#1b1b1b', 'Layaway', '30% down,<br>pay monthly', 'See terms', '#/info/layaway', 8]];
  return `<div class="snap" id="hero" data-dots="hd">${slides.map(([b, f, k, h, c, href, i]) => `<section class="slide" style="--sb:${b};--sf:${f}"><div><small>${k}</small><h1>${h}</h1>
    <a class="btn ${f === '#fff' ? 'o' : ''} sm" href="${href}">${c}</a></div><img src="${art(ITEMS[i], 'Front', false)}" alt=""></section>`).join('')}</div>
  <div class="dots" id="hd">${slides.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>
  <div class="sec" style="padding-top:12px"><h2>Shop by category</h2></div>
  <div class="tiles">${CATS.map(([c, l], i) => `<a class="tile" href="#/shop/${c}"><img src="${art(ITEMS[i * 4 + 1], 'Front', false)}" alt=""><span>${l}</span></a>`).join('')}</div>
  <div class="sec"><h2>New arrivals</h2><a href="#/shop">See all</a></div>
  <div class="row">${[...ITEMS].reverse().slice(0, 8).map(card).join('')}</div>
  <div class="trust"><a href="#/info/authenticity">${ic('shield')}Authenticity</a><a href="#/info/shipping">${ic('truck')}Delivery</a><a href="#/info/layaway">${ic('card')}Layaway</a></div>
  <section class="band"><h2>Have something to sell?</h2><p>Consign with A&amp;J, or ask about selling for cash.</p><a class="btn o" href="#/consign">Consign with us</a></section>
  <a class="help" href="#/chat">${ic('chat')}<p><b>Questions?</b><br>Ask the Help assistant about buying, shipping, payment or consigning.</p>${ic('next')}</a>
  <div class="sec"><h2>How it works</h2></div>
  <ol class="steps"><li>Browse items with condition and inclusions listed.</li><li>Send an inquiry; the A&amp;J team confirms availability.</li><li>Pay, then receive your item. Questions? Ask Help.</li></ol>
  <div class="foot"><a href="#/faqs">FAQs</a><a href="#/support">Support</a><a href="#/contact">Visit us</a><a href="#/info/terms">Terms</a><a href="#/info/privacy">Privacy</a></div>
  <p class="note">Prototype: items, prices and pictures are made-up samples. Pictures are generated placeholders, not photos.</p>`;
}
function list() {
  let l = filtered();
  if (sort === 'asc') l = [...l].sort((a, b) => a.price - b.price);
  if (sort === 'desc') l = [...l].sort((a, b) => b.price - a.price);
  return `<p class="cnt">${l.length} item${l.length === 1 ? '' : 's'}</p>` + (l.length ? `<div class="grid">${l.map(card).join('')}</div>`
    : `<div class="empty">${ic('search')}<p>No items found.<br>Try another word, category or filter.</p><button class="btn o" data-act="clear">Clear search &amp; filters</button></div>`);
}
function vShop(arg) {
  cat = CATS.some(c => c[0] === arg) ? arg : 'all';
  return `<div class="tool"><input type="search" id="q" placeholder="Search brand or item" aria-label="Search" value="${esc(q)}">
   <select id="sort" aria-label="Sort"><option value="featured">Featured</option><option value="asc" ${sort === 'asc' ? 'selected' : ''}>Price ↑</option><option value="desc" ${sort === 'desc' ? 'selected' : ''}>Price ↓</option></select>
   <button class="ib" data-act="filters" aria-label="Filters">${ic('filter')}${nFilters() ? `<span class="dot">${nFilters()}</span>` : ''}</button></div>
  <div class="chips">${[['all', 'All'], ...CATS].map(([c, l]) => `<a class="chip" href="#/shop/${c}" ${cat === c ? 'aria-current="true"' : ''}>${l}</a>`).join('')}</div>
  <div id="list" data-swipe="swcat">${list()}</div>`;
}
function filterSheet() {
  const n = filtered().length, pr = [['any', 'Any price'], ['lo', 'Under ₱30,000'], ['mid', '₱30,000 – ₱100,000'], ['hi', 'Over ₱100,000']];
  openSheet(`<h2>Filters</h2><div class="lh" style="padding:8px 0 0">Brand</div><div class="grpt">${BRANDS.map(b => `<button class="chip" aria-pressed="${F.brands.has(b)}" data-act="fbrand" data-v="${esc(b)}">${esc(b)}</button>`).join('')}</div>
   <div class="lh" style="padding:12px 0 0">Condition</div><div class="grpt">${[['any', 'Any'], ['new', 'Brand new'], ['pre', 'Pre-loved']].map(([v, l]) => `<button class="chip" aria-pressed="${F.cond === v}" data-act="fcond" data-v="${v}">${l}</button>`).join('')}</div>
   <div class="lh" style="padding:12px 0 0">Price</div><div class="grpt">${pr.map(([v, l]) => `<button class="chip" aria-pressed="${F.price === v}" data-act="fprice" data-v="${v}">${l}</button>`).join('')}</div>
   <div style="display:flex;gap:8px;margin-top:12px"><button class="btn o" style="flex:1" data-act="freset">Reset</button><button class="btn" style="flex:2" data-act="fdone">Show ${n} item${n === 1 ? '' : 's'}</button></div>`);
}

function vProduct(id) {
  const p = item(id); if (!p) return `<div class="empty">${ic('search')}<p>Item not found.</p><a class="btn" href="#/shop">Back to shop</a></div>`;
  const f = (k, v) => `<dt>${k}</dt><dd>${esc(v)}</dd>`;
  const more = ITEMS.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 4);
  return `<div class="gal"><div class="snap" id="gal" data-dots="gd">${p.views.map((v, i) => `<div><img src="${art(p, v)}" alt="${esc(p.title)}, ${v.toLowerCase()} (placeholder image)" data-act="zoom" data-i="${i}"></div>`).join('')}</div></div>
  <div class="gbar"><div class="thumbs">${p.views.map((v, i) => `<button data-act="thumb" data-i="${i}" aria-label="${v}"><img src="${art(p, v, false)}" alt=""></button>`).join('')}</div><div class="dots" id="gd" style="padding:0">${p.views.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div></div>
  <div class="pad"><span class="tag">${p.isNew ? 'Brand new' : 'Pre-loved'}</span>
   <div class="pbrand">${esc(p.brand)}</div><h1 class="pt">${esc(p.title)}</h1><div class="price">${peso(p.price)}</div>
   <dl class="facts">${f('Category', catName(p.cat))}${f('Condition', p.rank)}${f('Inclusions', p.inc)}${f('Flaws', p.flaw)}${f('Colour', p.color)}${f('Material', p.mat)}${f('Size', p.size)}</dl></div>
  <details open><summary>Details${ic('down')}</summary><div class="dbody"><p>Sample listing for the prototype. Real listings will carry A&amp;J’s own photos, description and condition notes.</p></div></details>
  <details><summary>Authenticity${ic('down')}</summary><div class="dbody"><p>A&amp;J says it sells only authentic items, checked by its own experts. This prototype can’t confirm any item.</p><p><a href="#/info/authenticity">Read about authenticity</a></p></div></details>
  <details><summary>Shipping &amp; payment${ic('down')}</summary><div class="dbody"><p>Nationwide delivery. Pay by bank transfer, GCash, card (+4%) or cash on pick-up.</p><p><a href="#/info/shipping">Shipping details</a> · <a href="#/info/payment">Payment options</a> · <a href="#/info/layaway">Layaway</a></p></div></details>
  <details><summary>Returns${ic('down')}</summary><div class="dbody"><p>All sales are final. Exchange only for undeclared flaws or missing inclusions.</p><p><a href="#/info/returns">Return policy</a></p></div></details>
  <div class="sec"><h2>You may also like</h2></div><div class="row">${more.map(card).join('')}</div><div style="height:12px"></div>
  <div class="buy">${heartBtn(p.id)}<a class="btn o" href="#/chat">Ask Help</a><button class="btn" data-act="inquire" data-id="${p.id}">Inquire to buy</button></div>`;
}
function vInquire(id) {
  const p = item(id); if (!p) return vProduct(id);
  const u = S.user;
  if (D.iname === undefined) { D.iname = u.name; D.imobile = u.mobile || ''; }
  return `<a class="item" href="#/p/${p.id}"><img src="${art(p, 'Front', false)}" alt=""><div><small>${esc(p.brand)}</small><b>${esc(p.title)}</b><b style="font-weight:500">${peso(p.price)}</b></div></a>
  <form class="formpage" id="inqform" data-id="${p.id}" novalidate>
   <p style="color:var(--mute);margin-bottom:14px">The A&amp;J team will confirm the item is available and send payment details.</p>
   ${fld('Your name', 'iname', {ac: 'name'})}${fld('Mobile number', 'imobile', {type: 'tel', ph: '09XX XXX XXXX'})}
   ${sel('Contact me through', 'icontact', ['Viber', 'WhatsApp', 'Messenger', 'Instagram', 'Phone call'])}
   ${sel('Payment method', 'ipay', ['Bank transfer', 'GCash', 'Credit card (+4% fee)', 'Cash on delivery (Metro Manila)', 'Cash on pick-up', 'Layaway'])}
   ${sel('Delivery', 'iship', ['Delivery within Metro Manila', 'Delivery outside Metro Manila', 'Pick up at showroom'])}
   ${fld('Note (optional)', 'inote', {area: 1, ph: 'Questions about the item?'})}
   <button class="btn blk" type="submit">Send inquiry</button></form>`;
}
function vWishlist() {
  const w = ITEMS.filter(p => S.wish.has(p.id));
  return w.length ? `<p class="cnt">${w.length} saved item${w.length === 1 ? '' : 's'}</p><div class="grid">${w.map(card).join('')}</div>`
    : `<div class="empty">${ic('heart')}<p>Nothing saved yet.<br>Tap the heart on an item to keep it here.</p><a class="btn" href="#/shop">Browse items</a></div>`;
}

/* ---------- views: inquiries + consignments ---------- */
const STEPS_INQ = ['Inquiry sent', 'A&J replies', 'Payment', 'Delivery or pick-up'];
const STEPS_CON = ['Submitted', 'Received', 'Authenticated', 'Listed', 'Sold', 'Paid out'];
const tl = (steps, at = 0) => `<ol class="tl">${steps.map((s, i) => `<li class="${i <= at ? 'on' : ''}">${s}</li>`).join('')}</ol>`;
function vInquiries() {
  return S.inq.length ? S.inq.map(r => { const p = item(r.item); return `<a class="item" href="#/inquiry/${r.ref}"><img src="${art(p, 'Front', false)}" alt=""><div><small>${r.ref} · ${r.date}</small><b>${esc(p.title)}</b><span class="pill">${r.status}</span></div></a>`; }).join('')
    : `<div class="empty">${ic('mail')}<p>No inquiries yet.<br>Open an item and tap “Inquire to buy”.</p><a class="btn" href="#/shop">Browse items</a></div>`;
}
function vInquiry(ref) {
  const r = S.inq.find(x => x.ref === ref); if (!r) return `<div class="empty"><p>Inquiry not found.</p><a class="btn" href="#/inquiries">My inquiries</a></div>`;
  const p = item(r.item), fresh = AJ.route().q.has('new');
  return `${fresh ? `<div class="hero2"><div class="ok">${ic('check')}</div><h1>Inquiry sent</h1><p>Reference ${r.ref}</p></div>` : ''}
  <a class="item" href="#/p/${p.id}"><img src="${art(p, 'Front', false)}" alt=""><div><small>${esc(p.brand)}</small><b>${esc(p.title)}</b><b style="font-weight:500">${peso(p.price)}</b></div></a>
  <dl class="kv"><dt>Reference</dt><dd>${r.ref}</dd><dt>Sent</dt><dd>${r.date}</dd><dt>Contact via</dt><dd>${esc(r.contact)}</dd><dt>Payment</dt><dd>${esc(r.pay)}</dd><dt>Delivery</dt><dd>${esc(r.ship)}</dd>${r.note ? `<dt>Note</dt><dd>${esc(r.note)}</dd>` : ''}</dl>
  <div class="pad" style="padding-top:0"><div class="lh" style="padding:0">What happens next</div>${tl(STEPS_INQ, 0)}<p class="note" style="margin:0 0 16px">Prototype: in the real app the A&amp;J team would reply in chat and this status would update.</p>
  <a class="btn blk" href="#/chat">Ask Help a question</a><a class="btn o blk" style="margin-top:8px" href="#/shop">Keep browsing</a></div>`;
}

function vConsign() {
  const steps = ['Send details and photos', 'Drop off at the showroom or ship it (Grab, Lalamove or LBC)', 'A&J authenticates and lists it', 'You’re paid after the buyer receives the item'];
  return `<section class="band" style="margin:0"><h2>Consign with A&amp;J</h2><p>Let us sell your authentic luxury pieces.</p><a class="btn o" href="#/consignform">Start a consignment request</a></section>

    const s = W.step, rules = {};
    if (s === 0) Object.assign(rules, {ccat: req('Choose a category.'), cbrand: req('Enter the brand.'), cname: req('Enter the item name or model.'), ccond: req('Choose the condition.'),
      cprice: [v => !v || /^\d[\d,]*$/.test(v.trim()), 'Use numbers only.']});
    if (s === 1) { const miss = AJ.PHOTO_SLOTS.filter((o, i) => o.req && !W.photos.has(i)).map(o => o.label); if (miss.length) { $('[data-for="photos"]').textContent = 'Still needed: ' + miss.join(', ') + '.'; return; } }
    if (s === 2) rules.cown = ticked('Please confirm ownership to continue.');
    if (s === 3) Object.assign(rules, {cmobile: mobileRule, cterms: ticked('Please accept the terms to submit.')});
    if (!validate(f, rules)) return;
    if (s < 3) { W.step++; refresh(false); return; }
    const r = {ref: AJ.ref('CON'), cat: CATS.find(c => c[1] === D.ccat)[0], title: `${D.cbrand.trim()} ${D.cname.trim()}`, mode: D.mode === 'sell' ? 'Sell to A&J' : 'Consign', cond: D.ccond, photos: W.photos.size + ' of 10', hand: D.chand === 'ship' ? 'Ship it' : 'Drop off at showroom', date: AJ.fmtDate(new Date()), status: 'Submitted'};
    S.con.unshift(r); resetWizard(); go('#/consignment/' + r.ref + '?new');
  }
});
document.addEventListener('keydown', e => e.key === 'Escape' && closeSheet());
document.addEventListener('scroll', e => { // gallery / hero dots
  const el = e.target; if (!el.dataset?.dots) return;
  const i = Math.round(el.scrollLeft / el.clientWidth);
  $$(`#${el.dataset.dots} i`).forEach((d, k) => d.classList.toggle('on', k === i));
  if (el.id === 'intro') $('#inext').textContent = i === el.children.length - 1 ? 'Get started' : 'Next';
}, true);
AJ.gestures({ // swipe: back from the left edge, pull down to refresh lists, sheets and photo viewer drag down to close
  act: (n, el, d) => ACT[n]?.(el, d),
  edge: () => { const r = AJ.route().name; return R[r]?.back ? ACT.back : ['signup', 'forgot', 'adminlogin'].includes(r) ? () => go('#/login') : null; },
  pull: () => ['home', 'shop', 'wishlist', 'inquiries', 'consignments', 'support', 'admin', 'atickets'].includes(AJ.route().name) ? () => refresh() : null
});
addEventListener('hashchange', () => render());
if (!location.hash) history.replaceState(null, '', '#/welcome');
render(false);
</script>
</body>
